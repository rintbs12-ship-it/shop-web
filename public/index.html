<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>ហាងរបស់ខ្ញុំ</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <!-- Header -->
  <header class="header" id="header">
    <div class="header-inner">
      <div class="shop-brand">
        <img id="shopLogo" src="" alt="Logo" style="display:none">
        <div class="shop-info">
          <h1 id="shopName">ហាងរបស់ខ្ញុំ</h1>
          <p id="shopDesc"></p>
        </div>
      </div>
      <div class="header-actions">
        <a id="fbLink" href="#" target="_blank" style="display:none" class="social-btn fb">
          <i class="fab fa-facebook"></i>
        </a>
        <a id="tgLink" href="#" target="_blank" style="display:none" class="social-btn tg">
          <i class="fab fa-telegram"></i>
        </a>
        <a id="phoneLink" href="#" style="display:none" class="social-btn phone">
          <i class="fas fa-phone"></i>
        </a>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="main">

    <!-- Hero Banner -->
    <div class="hero-banner">
      <div class="hero-content">
        <h2 id="heroBannerTitle">ស្វាគមន៍មកកាន់ហាងយើង</h2>
        <p id="heroBannerDesc">ទំនិញគុណភាពល្អ តម្លៃសមរម្យ</p>
      </div>
    </div>

    <!-- Search Bar -->
    <div class="search-section">
      <div class="search-wrap">
        <i class="fas fa-search search-icon"></i>
        <input type="text" id="searchInput" class="search-input" placeholder="ស្វែងរក... (ឧ. 5k followers, page)">
        <button class="search-clear" id="searchClear" style="display:none">
          <i class="fas fa-times"></i>
        </button>
      </div>
    </div>

    <!-- Category Tabs -->
    <div class="category-tabs">
      <button class="tab-btn active" data-tab="all">
        <i class="fas fa-th-large"></i> ទំនិញទាំងអស់
      </button>
      <button class="tab-btn" data-tab="story">
        <i class="fas fa-film"></i> ផេករឿង
      </button>
      <button class="tab-btn" data-tab="pe">
        <i class="fas fa-star"></i> ផេក PE
      </button>
    </div>

    <!-- Products Section -->
    <section class="products-section">
      <div class="section-header">
        <h2><i class="fas fa-th-large"></i> ទំនិញទាំងអស់</h2>
      </div>
      <div class="products-grid" id="productsGrid">
        <div class="loading">
          <i class="fas fa-spinner fa-spin"></i>
          <p>កំពុងផ្ទុក...</p>
        </div>
      </div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-top">
        <div class="footer-col">
          <img id="footerLogo" src="" alt="Logo" style="display:none; width:60px; height:60px; border-radius:50%; object-fit:cover; margin-bottom:10px">
          <h3 id="footerName">ហាងរបស់ខ្ញុំ</h3>
          <p id="footerDesc" style="font-size:0.85rem; color:#aaa; margin-top:6px"></p>
        </div>
        <div class="footer-col">
          <h4>ទំនាក់ទំនង</h4>
          <p id="footerPhone"></p>
          <p id="footerAddress"></p>
        </div>
        <div class="footer-col">
          <h4>បណ្តាញសង្គម</h4>
          <div class="footer-social">
            <a id="footerFb" href="#" target="_blank" style="display:none"><i class="fab fa-facebook"></i> Facebook</a>
            <a id="footerTg" href="#" target="_blank" style="display:none"><i class="fab fa-telegram"></i> Telegram</a>
          </div>
        </div>
      </div>
      <div class="footer-bottom">
        <p>© 2026 <span id="footerCopyName">ហាងរបស់ខ្ញុំ</span>. រក្សាសិទ្ធិគ្រប់យ៉ាង.</p>
      </div>
    </div>
  </footer>

  <!-- Floating Telegram Button -->
  <a id="floatTelegram" href="#" target="_blank" class="float-telegram">
    <i class="fab fa-telegram"></i>
  </a>

  <script src="/js/index.js"></script>
</body>
</html>
