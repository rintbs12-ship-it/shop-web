<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ហាងរបស់ខ្ញុំ</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <!-- Header -->
  <header class="header" id="header">
    <div class="header-inner">
      <div class="shop-brand">
        <img id="shopLogo" src="" alt="Logo" style="display:none">
        <div class="shop-info">
          <h1 id="shopName">ហាងរបស់ខ្ញុំ</h1>
          <p id="shopDesc"></p>
        </div>
      </div>
      <div class="header-actions">
        <a id="fbLink" href="#" target="_blank" style="display:none" class="social-btn fb">
          <i class="fab fa-facebook"></i>
        </a>
        <a id="tgLink" href="#" target="_blank" style="display:none" class="social-btn tg">
          <i class="fab fa-telegram"></i>
        </a>
        <a id="phoneLink" href="#" style="display:none" class="social-btn phone">
          <i class="fas fa-phone"></i>
        </a>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="main">

    <!-- Hero Banner -->
    <div class="hero-banner">
      <div class="hero-content">
        <h2 id="heroBannerTitle">ស្វាគមន៍មកកាន់ហាងយើង</h2>
        <p id="heroBannerDesc">ទំនិញគុណភាពល្អ តម្លៃសមរម្យ</p>
      </div>
    </div>

    <!-- Products Section -->
    <section class="products-section">
      <div class="section-header">
        <h2><i class="fas fa-th-large"></i> ទំនិញទាំងអស់</h2>
      </div>
      <div class="products-grid" id="productsGrid">
        <div class="loading">
          <i class="fas fa-spinner fa-spin"></i>
          <p>កំពុងផ្ទុក...</p>
        </div>
      </div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-inner">
      <p id="footerName">ហាងរបស់ខ្ញុំ</p>
      <p id="footerPhone"></p>
      <p id="footerAddress"></p>
      <div class="footer-social">
        <a id="footerFb" href="#" target="_blank" style="display:none"><i class="fab fa-facebook"></i></a>
        <a id="footerTg" href="#" target="_blank" style="display:none"><i class="fab fa-telegram"></i></a>
      </div>
    </div>
  </footer>

  <script src="/js/index.js"></script>
</body>
</html>
